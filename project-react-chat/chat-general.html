<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>#general - React Chat</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="container-fluid d-flex flex-column h-100">
      <header class="text-light bg-primary px-1 d-flex flex-wrap justify-content-between align-items-center">
        <h1>React Chat - Live!</h1>
        <nav aria-label="Main navigation">
          <ul class="nav nav-pills">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link active" href="chat-general.html" aria-current="page">Chat</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
            <li class="nav-item"><a class="nav-link" href="profile.html" aria-label="Parrot profile"><img src="../public/img/Parrot.png" alt="Parrot avatar"></a></li>
            <li class="nav-item"><button class="btn btn-secondary ms-2" type="button" disabled>Sign Out</button></li>
          </ul>
        </nav>
      </header>
      <main class="row flex-grow-1 overflow-hidden">
        <nav class="channel-nav col-3 h-100 bg-secondary px-0 py-3" aria-label="Chat channels">
          <h2 class="h6 text-white px-2">Channels</h2>
          <ul class="p-0">
            <li><a href="chat-general.html" aria-current="page"># general</a></li>
            <li><a href="chat-social.html"># social</a></li>
            <li><a href="chat-random.html"># random</a></li>
            <li><a href="chat-birds.html"># birds</a></li>
            <li><a href="chat-dank-memes.html"># dank-memes</a></li>
          </ul>
        </nav>
        <section class="col d-flex flex-column overflow-hidden">
          <h2># general</h2>
          <div class="scrollable-pane pt-2 my-2">
            <article class="message d-flex mb-3"><img class="me-2" src="../public/img/Parrot.png" alt="Parrot avatar"><div><p class="user-name">Parrot</p><p>I'm not a duck!</p><span class="text-danger" aria-label="Liked">♥</span></div></article>
            <article class="message d-flex mb-3"><img class="me-2" src="../public/img/Eagle.png" alt="Eagle avatar"><div><p class="user-name">Eagle</p><p>Lucky duck</p><span class="text-secondary" aria-label="Like">♡</span></div></article>
            <article class="message d-flex mb-3"><img class="me-2" src="../public/img/Parrot.png" alt="Parrot avatar"><div><p class="user-name">Parrot</p><p>It's warm over here</p><span class="text-secondary" aria-label="Like">♡</span></div></article>
            <article class="message d-flex mb-3"><img class="me-2" src="../public/img/Penguin.png" alt="Penguin avatar"><div><p class="user-name">Penguin</p><p>It's so cold out today!</p><span class="text-secondary" aria-label="Like">♡</span></div></article>
          </div>
          <div class="input-group my-2" aria-label="Message composer example">
            <img src="../public/img/Parrot.png" alt="Parrot avatar">
            <textarea class="form-control" rows="2" aria-label="Example message" placeholder="Type a new message"></textarea>
            <button class="btn btn-secondary" type="button" disabled aria-label="Send message">➤</button>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
